name: Build Warungku APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Ekstrak ZIP Proyek
      run: |
        unzip -o Warungku-Android-Project.zip
        ls -la # Ini untuk melihat daftar file yang ada di dalam repo
    
    - uses: gradle/actions/setup-gradle@v3
    
    - name: Build APK
      run: |
        # Deteksi lokasi gradlew secara otomatis
        if [ -f "gradlew" ]; then
          echo "Gradlew ada di root, memulai build..."
          chmod +x ./gradlew && ./gradlew assembleDebug
        elif [ -f "Warungku-Android-Project/gradlew" ]; then
          echo "Gradlew ada di dalam subfolder, memulai build..."
          cd Warungku-Android-Project
          chmod +x ./gradlew && ./gradlew assembleDebug
        else
          echo "Error: File gradlew tidak ditemukan di mana pun!"
          find . -name "gradlew" # Mencari di mana file gradlew berada
          exit 1
        fi
        
    - uses: actions/upload-artifact@v4
      with:
        name: Warungku-Debug-APK
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
